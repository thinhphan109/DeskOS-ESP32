[env:esp32-s3-devkitc-1]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8 / WROOM-1: 16 MB Quad flash + 8 MB Octal PSRAM.
; Do NOT select opi_opi unless your module is the different N16R8V WROOM-2.
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DWEBSOCKETS_SERVER_CLIENT_MAX=4

; MèoDesk v1.7: 6 MiB firmware A/B slots plus two raw motion-pack banks.
; Do NOT mount assets as SPIFFS; CatPackManager owns that raw partition.
; First deployment from huge_app REQUIRES USB and a private NVS backup.
; See docs/OTA_MIGRATION.md before pressing Upload the first time.
board_build.partitions = meodesk_ota_16mb.csv

; Native USB CDC is board-port dependent. Only enable when using that port.
; build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    lovyan03/LovyanGFX@1.2.33
    bblanchon/ArduinoJson@^7.4.2
    links2004/WebSockets@2.7.3

; If the board shows glitches at 40 MHz, change cfg.freq_write
; to 20000000 in src/display_config.h.

[env:mimi-public]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DMIMI_PUBLIC_FIRMWARE=1

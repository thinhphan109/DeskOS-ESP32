# Include these locations inside an existing HTTPS server{} after staging is reviewed.
# Set the root to the publisher output, preserving releases/<id>/ URLs permanently.
location /channels/ {
    root /srv/mimi-updates;
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
}
location /releases/ {
    root /srv/mimi-updates;
    try_files $uri =404;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

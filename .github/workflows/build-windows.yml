name: Windows Companion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows_agent/**'
      - 'packaging/windows/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Test agent
        run: |
          python -m pip install -r windows_agent/requirements-gui.txt
          python -m unittest discover -s windows_agent/tests -v
      - name: Build distributable
        shell: pwsh
        run: .\packaging\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MeoDeskCompanion-Windows-x64
          path: MeoDeskCompanion-Windows-x64.zip
